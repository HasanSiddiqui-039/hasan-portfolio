
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Advanced Sign In & Login</title>

</head>


<body>

<script>


// ======================================================
// CONTAINER
// ======================================================

let container =
    document.createElement("div");

container.className =
    "container";

document.body.appendChild(container);


// ======================================================
// CSS
// ======================================================

let style =
    document.createElement("style");


style.innerText = `


/* ======================================================
   BASIC RESET
====================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family: Arial, sans-serif;

}


/* ======================================================
   BODY
====================================================== */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 20%,
            #182848,
            transparent 40%
        ),

        radial-gradient(
            circle at 80% 80%,
            #3a0b45,
            transparent 40%
        ),

        #050509;

}


/* ======================================================
   BACKGROUND GLOW
====================================================== */

body::before {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    border-radius: 50%;

    background: #00d9ff;

    filter: blur(130px);

    opacity: .25;

    top: -180px;

    left: -150px;

    animation:

        backgroundMove1
        8s
        ease-in-out
        infinite
        alternate;

}


body::after {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    border-radius: 50%;

    background: #9d00ff;

    filter: blur(130px);

    opacity: .25;

    right: -180px;

    bottom: -150px;

    animation:

        backgroundMove2
        9s
        ease-in-out
        infinite
        alternate;

}


@keyframes backgroundMove1 {

    0% {

        transform:
            translate(0, 0)
            scale(1);

    }

    100% {

        transform:
            translate(220px, 180px)
            scale(1.3);

    }

}


@keyframes backgroundMove2 {

    0% {

        transform:
            translate(0, 0)
            scale(1);

    }

    100% {

        transform:
            translate(-200px, -150px)
            scale(1.2);

    }

}


/* ======================================================
   CONTAINER
====================================================== */

.container {

    position: relative;

    width: 400px;

    padding: 40px;

    z-index: 5;

    border-radius: 25px;

    background:

        rgba(255,255,255,.07);

    backdrop-filter:

        blur(25px);

    border:

        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.65),

        inset 0 0 30px
        rgba(255,255,255,.03);

    animation:

        cardFloat
        5s
        ease-in-out
        infinite;

}


/* ======================================================
   ANIMATED BORDER
====================================================== */

.container::before {

    content: "";

    position: absolute;

    inset: -2px;

    border-radius: 27px;

    background:

        linear-gradient(

            120deg,

            transparent,

            #00d9ff,

            #8a2be2,

            #ff0080,

            transparent

        );

    background-size: 300% 300%;

    animation:

        borderMove
        5s
        linear
        infinite;

    z-index: -2;

}


.container::after {

    content: "";

    position: absolute;

    inset: 2px;

    border-radius: 23px;

    background:

        rgba(8,8,18,.94);

    z-index: -1;

}


@keyframes borderMove {

    0% {

        background-position:
            0% 50%;

    }

    50% {

        background-position:
            100% 50%;

    }

    100% {

        background-position:
            0% 50%;

    }

}


/* ======================================================
   CARD FLOAT
====================================================== */

@keyframes cardFloat {

    0% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-10px);

    }

    100% {

        transform:
            translateY(0);

    }

}


/* ======================================================
   HEADING
====================================================== */

h1 {

    text-align: center;

    margin-bottom: 10px;

    font-size: 32px;

    background:

        linear-gradient(

            90deg,

            #ffffff,

            #00d9ff,

            #8a2be2,

            #ffffff

        );

    background-size: 250%;

    -webkit-background-clip: text;

    color: transparent;

    animation:

        headingAnimation
        4s
        linear
        infinite;

}


@keyframes headingAnimation {

    0% {

        background-position:
            0%;

    }

    100% {

        background-position:
            250%;

    }

}


/* ======================================================
   SUBTITLE
====================================================== */

.subtitle {

    text-align: center;

    color: #aaa;

    margin-bottom: 28px;

    animation:

        subtitleAnimation
        .8s
        ease;

}


@keyframes subtitleAnimation {

    from {

        opacity: 0;

        transform:
            translateY(-15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* ======================================================
   INPUT
====================================================== */

input {

    width: 100%;

    padding: 14px 5px;

    margin-bottom: 22px;

    border: none;

    border-bottom:

        1px solid
        rgba(255,255,255,.25);

    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;

    transition:

        .4s;

}


input::placeholder {

    color: #888;

}


input:focus {

    border-bottom:

        1px solid
        #00d9ff;

    box-shadow:

        0 5px 15px
        rgba(0,217,255,.15);

    transform:

        scale(1.02);

}


/* ======================================================
   BUTTON
====================================================== */

button {

    position: relative;

    overflow: hidden;

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background:

        linear-gradient(

            90deg,

            #00d9ff,

            #8a2be2,

            #ff0080

        );

    background-size: 200%;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:

        .4s;

    animation:

        buttonGradient
        4s
        linear
        infinite;

}


/* BUTTON SHINE */

button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(

            90deg,

            transparent,

            rgba(255,255,255,.5),

            transparent

        );

    transform:

        skewX(-20deg);

    animation:

        buttonShine
        3s
        infinite;

}


@keyframes buttonShine {

    0% {

        left: -100%;

    }

    50%,
    100% {

        left: 150%;

    }

}


@keyframes buttonGradient {

    0% {

        background-position:
            0%;

    }

    100% {

        background-position:
            200%;

    }

}


button:hover {

    transform:

        translateY(-4px)
        scale(1.02);

    box-shadow:

        0 10px 30px
        rgba(0,217,255,.4);

}


button:active {

    transform:

        scale(.95);

}


/* ======================================================
   SWITCH TEXT
====================================================== */

.switch {

    text-align: center;

    margin-top: 22px;

    color: #aaa;

    font-size: 14px;

}


.switch span {

    color: #00d9ff;

    cursor: pointer;

    font-weight: bold;

    position: relative;

    transition:

        .3s;

}


.switch span:hover {

    color: #ffffff;

}


.switch span::after {

    content: "";

    position: absolute;

    left: 0;

    bottom: -4px;

    width: 0;

    height: 2px;

    background: #00d9ff;

    transition:

        .3s;

}


.switch span:hover::after {

    width: 100%;

}


/* ======================================================
   MESSAGE
====================================================== */

.message {

    text-align: center;

    margin-top: 18px;

    min-height: 20px;

    font-weight: bold;

    animation:

        messageAnimation
        .4s
        ease;

}


@keyframes messageAnimation {

    from {

        opacity: 0;

        transform:
            scale(.8);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* ======================================================
   ERROR SHAKE
====================================================== */

.shake {

    animation:

        shake
        .5s
        ease;

}


@keyframes shake {

    0% {

        transform:
            translateX(0);

    }

    20% {

        transform:
            translateX(-12px);

    }

    40% {

        transform:
            translateX(12px);

    }

    60% {

        transform:
            translateX(-8px);

    }

    80% {

        transform:
            translateX(8px);

    }

    100% {

        transform:
            translateX(0);

    }

}


/* ======================================================
   SUCCESS
====================================================== */

.success {

    animation:

        successPulse
        .8s
        ease;

}


@keyframes successPulse {

    0% {

        transform:
            scale(1);

        box-shadow:
            0 0 0
            rgba(0,255,150,0);

    }

    50% {

        transform:
            scale(1.04);

        box-shadow:

            0 0 50px
            rgba(0,255,150,.4);

    }

    100% {

        transform:
            scale(1);

    }

}


/* ======================================================
   MOBILE
====================================================== */

@media(max-width:500px) {

    .container {

        width: 90%;

        padding: 30px 25px;

    }

    h1 {

        font-size: 27px;

    }

}

document.head.appendChild(style);


// ======================================================
// OTP PAGE
// ======================================================

function openOTPPage() {

    window.location.href =
        "security.html";

}


// ======================================================
// SIGN IN PAGE
// ======================================================

function signInPage() {


    // Old content remove

    container.innerHTML = "";


    // Heading

    let heading =
        document.createElement("h1");

    heading.innerText =
        "Sign In";


    // Subtitle

    let subtitle =
        document.createElement("p");

    subtitle.className =
        "subtitle";

    subtitle.innerText =
        "Create Your New Account";


    // Name

    let nameInput =
        document.createElement("input");

    nameInput.type =
        "text";

    nameInput.placeholder =
        "Enter your name";


    // Email

    let emailInput =
        document.createElement("input");

    emailInput.type =
        "email";

    emailInput.placeholder =
        "Enter your email";


    // Password

    let passwordInput =
        document.createElement("input");

    passwordInput.type =
        "password";

    passwordInput.placeholder =
        "Enter your password";


    // Button

    let signInButton =
        document.createElement("button");

    signInButton.innerText =
        "Sign In";


    // Switch

    let loginText =
        document.createElement("p");

    loginText.className =
        "switch";

    loginText.innerHTML =

        `Already have an account?
        <span>Login</span>`;


    // Message

    let message =
        document.createElement("p");

    message.className =
        "message";


    // ==================================================
    // APPEND
    // ==================================================

    container.appendChild(
        heading
    );

    container.appendChild(
        subtitle
    );

    container.appendChild(
        nameInput
    );

    container.appendChild(
        emailInput
    );

    container.appendChild(
        passwordInput
    );

    container.appendChild(
        signInButton
    );

    container.appendChild(
        loginText
    );

    container.appendChild(
        message
    );


    // ==================================================
    // SIGN IN BUTTON
    // ==================================================

    signInButton.addEventListener(
        "click",
        function() {


            let name =
                nameInput.value;

            let email =
                emailInput.value;

            let password =
                passwordInput.value;


            // Empty fields

            if (

                name == "" ||

                email == "" ||

                password == ""

            ) {


                message.innerText =
                    "Please fill all fields";

                message.style.color =
                    "#ff4b5c";


                // Shake

                container.classList.add(
                    "shake"
                );


                setTimeout(
                    function() {

                        container.classList.remove(
                            "shake"
                        );

                    },
                    500
                );


                return;

            }


            // Save data

            localStorage.setItem(
                "userName",
                name
            );

            localStorage.setItem(
                "userEmail",
                email
            );

            localStorage.setItem(
                "userPassword",
                password
            );


            // Success animation

            container.classList.add(
                "success"
            );


            message.innerText =
                "Account created successfully!";

            message.style.color =
                "#00ff9d";


            // OTP

            setTimeout(

                function() {

                    openOTPPage();

                },

                1000

            );

        }
    );


    // ==================================================
    // LOGIN PAGE
    // ==================================================

    loginText
        .querySelector("span")
        .addEventListener(

            "click",

            function() {

                // Exit animation

                container.style.animation =
                    "none";


                container.animate(

                    [

                        {
                            transform:
                                "translateX(0)"
                        },

                        {
                            transform:
                                "translateX(-80px)",
                            opacity: 0
                        }

                    ],

                    {

                        duration: 350,

                        easing:
                            "ease-in"

                    }

                ).onfinish =

                    function() {

                        loginPage();

                    };

            }

        );


    // ==================================================
    // ENTRANCE ANIMATION
    // ==================================================

    container.animate(

        [

            {

                opacity: 0,

                transform:
                    "translateY(50px) scale(.9)"

            },

            {

                opacity: 1,

                transform:
                    "translateY(0) scale(1)"

            }

        ],

        {

            duration: 700,

            easing:
                "cubic-bezier(.17,.67,.3,1.3)"

        }

    );

}


// ======================================================
// LOGIN PAGE
// ======================================================

function loginPage() {


    container.innerHTML = "";


    // Heading

    let heading =
        document.createElement("h1");

    heading.innerText =
        "Login";


    // Subtitle

    let subtitle =
        document.createElement("p");

    subtitle.className =
        "subtitle";

    subtitle.innerText =
        "Welcome Back";


    // Email

    let emailInput =
        document.createElement("input");

    emailInput.type =
        "email";

    emailInput.placeholder =
        "Enter your email";


    // Password

    let passwordInput =
        document.createElement("input");

    passwordInput.type =
        "password";

    passwordInput.placeholder =
        "Enter your password";


    // Button

    let loginButton =
        document.createElement("button");

    loginButton.innerText =

    // Switch

    let signInText =
        document.createElement("p");

    signInText.className =
        "switch";

    signInText.innerHTML =

        `Don't have an account?
        <span>Sign In</span>`;


    // Message

    let message =
        document.createElement("p");

    message.className =
        "message";


    // ==================================================
    // APPEND
    // ==================================================

    container.appendChild(
        heading
    );

    container.appendChild(
        subtitle
    );

    container.appendChild(
        emailInput
    );

    container.appendChild(
        passwordInput
    );

    container.appendChild(
        loginButton
    );

    container.appendChild(
        signInText
    );

    container.appendChild(
        message
    );


    // ==================================================
    // LOGIN BUTTON
    // ==================================================

    loginButton.addEventListener(

        "click",

        function() {


            let email =
                emailInput.value;

            let password =
                passwordInput.value;


            // Empty fields

            if (

                email == "" ||

                password == ""

            ) {


                message.innerText =
                    "Please enter email and password";

                message.style.color =
                    "#ff4b5c";


                // Shake animation

                container.classList.add(
                    "shake"
                );


                setTimeout(

                    function() {

                        container.classList.remove(
                            "shake"
                        );

                    },

                    500

                );


                return;

            }


            // Success

            message.innerText =
                "Login successful!";

            message.style.color =
                "#00ff9d";


            container.classList.add(
                "success"
            );


            // OTP page

            setTimeout(

                function() {

                    openOTPPage();

                },

                1000

            );

        }

    );


    // ==================================================
    // SIGN IN PAGE
    // ==================================================

    signInText
        .querySelector("span")
        .addEventListener(

            "click",

            function() {


                container.animate(

                    [

                        {

                            transform:
                                "translateX(0)"

                        },

                        {

                            transform:
                                "translateX(80px)",

                            opacity: 0

                        }

                    ],

                    {

                        duration: 350,

                        easing:
                            "ease-in"

                    }

                ).onfinish =

                    function() {

                        signInPage();

                    };

            }

        );


    // ==================================================
    // ENTRANCE ANIMATION
    // ==================================================

    container.animate(

        [

            {

                opacity: 0,

                transform:
                    "translateY(50px) scale(.9)"

            },

            {

                opacity: 1,

                transform:
                    "translateY(0) scale(1)"

            }

        ],

        {

            duration: 700,

            easing:
                "cubic-bezier(.17,.67,.3,1.3)"

        }

    );

}


// ======================================================
// START
// ======================================================

signInPage();


</script>

</body>

</html>
