<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub API Project | Hasan Siddiqui</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #e2e8f0;

            background:
                radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.18), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.18), transparent 30%),
                linear-gradient(135deg, #020617, #0f172a, #111827);

            overflow-x: hidden;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;

            background: rgba(34, 197, 94, 0.12);

            border-radius: 50%;

            filter: blur(80px);

            top: -150px;
            left: -150px;

            animation: moveGlow 8s infinite alternate ease-in-out;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;

            background: rgba(59, 130, 246, 0.12);

            border-radius: 50%;

            filter: blur(80px);

            right: -120px;
            bottom: -120px;

            animation: moveGlow2 9s infinite alternate ease-in-out;

            pointer-events: none;
        }


        @keyframes moveGlow {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(150px, 100px);
            }
        }


        @keyframes moveGlow2 {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-120px, -100px);
            }
        }


        /* =========================
           MAIN WRAPPER
        ========================= */

        .wrap {
            width: 92%;
            max-width: 950px;

            margin: 70px auto;

            position: relative;
            z-index: 2;
        }


        /* =========================
           GLASS CARD
        ========================= */

        .card {

            padding: 40px;

            border-radius: 25px;

            background: rgba(30, 41, 59, 0.65);

            border: 1px solid rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            animation: cardAppear 0.8s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            font-size: clamp(32px, 5vw, 52px);

            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #86efac,
                #60a5fa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-size: 200% auto;

            animation: gradientText 4s linear infinite;
        }


        @keyframes gradientText {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }


        .card > p {

            color: #94a3b8;

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 25px;
        }


        /* =========================
           SEARCH AREA
        ========================= */

        .search {

            display: flex;

            gap: 12px;

            margin: 25px 0;
        }


        .search input {

            flex: 1;

            padding: 15px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            outline: none;

            background: rgba(15, 23, 42, 0.75);

            color: white;

            font-size: 15px;

            transition: 0.3s ease;

            box-shadow:
                inset 0 0 15px rgba(0, 0, 0, 0.15);
        }


        .search input::placeholder {
            color: #64748b;
        }


        .search input:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.12),
                0 0 25px rgba(34, 197, 94, 0.15);

            transform: translateY(-2px);
        }


        /* =========================
           SEARCH BUTTON
        ========================= */

        .search button {

            position: relative;

            padding: 0 25px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            color: #052e16;

            font-weight: 800;

            cursor: pointer;

            overflow: hidden;

            transition: 0.3s ease;

            box-shadow:
                0 8px 20px rgba(34, 197, 94, 0.25);
        }


        .search button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.5),
                transparent
            );

            transform: skewX(-20deg);

            transition: 0.6s;
        }


        .search button:hover::before {
            left: 130%;
        }


        .search button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(34, 197, 94, 0.4);
        }


        .search button:active {
            transform: scale(0.96);
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            text-align: center;

            min-height: 35px;

            color: #86efac;

            font-weight: 600;

            padding: 5px;
        }


        /* =========================
           LOADING ANIMATION
        ========================= */

        .loading {

            display: inline-flex;

            gap: 6px;

            align-items: center;
        }


        .loading span {

            width: 7px;
            height: 7px;

            background: #22c55e;

            border-radius: 50%;

            animation: loading 0.8s infinite alternate;
        }


        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }


        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }


        @keyframes loading {

            from {
                transform: translateY(0);
                opacity: 0.4;
            }

            to {
                transform: translateY(-6px);
                opacity: 1;
            }
        }


        /* =========================
           PROFILE
        ========================= */

        .profile {

            display: grid;

            grid-template-columns: 170px 1fr;

            gap: 30px;

            align-items: center;

            margin-top: 15px;

            padding: 28px;

            border-radius: 20px;

            background: rgba(15, 23, 42, 0.55);

            border: 1px solid rgba(255,255,255,0.08);

            animation: profileAppear 0.7s ease;
        }


        @keyframes profileAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           PROFILE IMAGE
        ========================= */

        .profile img {

            width: 160px;
            height: 160px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #22c55e;

            box-shadow:
                0 0 0 6px rgba(34, 197, 94, 0.08),
                0 0 35px rgba(34, 197, 94, 0.3);

            transition: 0.4s ease;
        }


        .profile img:hover {

            transform: scale(1.07) rotate(2deg);

            box-shadow:
                0 0 0 8px rgba(34, 197, 94, 0.1),
                0 0 50px rgba(34, 197, 94, 0.5);
        }


        /* =========================
           PROFILE TEXT
        ========================= */

        .profile h2 {

            font-size: 30px;

            margin-bottom: 8px;

            color: #ffffff;
        }


        .profile p {

            color: #94a3b8;

            line-height: 1.6;

            margin-bottom: 18px;
        }


        /* =========================
           STATS
        ========================= */

        .stats {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }


        .stat {

            background: rgba(51, 65, 85, 0.7);

            padding: 12px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.06);

            color: #cbd5e1;

            font-size: 14px;

            transition: 0.3s ease;
        }


        .stat:hover {

            transform: translateY(-5px);

            background: rgba(34, 197, 94, 0.15);

            border-color: rgba(34, 197, 94, 0.35);

            box-shadow:
                0 8px 20px rgba(34, 197, 94, 0.12);
        }


        /* =========================
           LINKS
        ========================= */

        .links {

            margin-top: 20px;
        }


        .links a {

            display: inline-block;

            color: #86efac;

            text-decoration: none;

            margin-right: 18px;

            font-weight: 700;

            position: relative;

            transition: 0.3s ease;
        }


        .links a::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 0;
            height: 2px;

            background: #22c55e;

            transition: 0.3s ease;
        }


        .links a:hover {

            color: #ffffff;

            transform: translateY(-2px);
        }


        .links a:hover::after {
            width: 100%;
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            color: #fca5a5;

            background: rgba(127, 29, 29, 0.18);

            border: 1px solid rgba(248, 113, 113, 0.25);

            padding: 12px;

            border-radius: 10px;

            animation: shake 0.35s ease;
        }


        @keyframes shake {

            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .wrap {
                margin: 30px auto;
            }

            .card {
                padding: 25px 18px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                padding: 14px;
            }

            .profile {

                grid-template-columns: 1fr;

                text-align: center;

                padding: 25px 15px;
            }

            .profile img {
                margin: auto;
            }

            .stats {
                justify-content: center;
            }

            .links {
                text-align: center;
            }
        }


        @media (max-width: 400px) {

            h1 {
                font-size: 32px;
            }

            .profile h2 {
                font-size: 25px;
            }

            .profile img {
                width: 130px;
                height: 130px;
            }
        }

    </style>
</head>


<body>

    <div class="wrap">

        <div class="card">

            <h1>GitHub Profile Finder</h1>

            <p>
                JavaScript Fetch API integration with loading
                and error handling.
            </p>


            <div class="search">

                <input
                    id="username"
                    value="HasanSiddiqui-039"
                    placeholder="GitHub username"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>


            <div
                class="status"
                id="status">
            </div>


            <section id="result"></section>

        </div>

    </div>


    <script>

        const username =
            document.getElementById("username");

        const status =
            document.getElementById("status");

        const result =
            document.getElementById("result");


        async function searchUser() {

            const user =
                username.value.trim();


            if (!user) {

                status.innerHTML =
                    `<div class="error">
                        Please enter a username.
                    </div>`;

                result.innerHTML = "";

                return;
            }


            status.innerHTML = `
                <div class="loading">
                    <span></span>
                    <span></span>
                    <span></span>
                    Loading GitHub profile...
                </div>
            `;

            result.innerHTML = "";


            try {

                const res =
                    await fetch(
                        `https://api.github.com/users/${encodeURIComponent(user)}`
                    );


                if (!res.ok) {

                    throw new Error(
                        res.status === 404
                            ? "User not found."
                            : "API request failed."
                    );

                }


                const data =
                    await res.json();


                status.textContent = "";


                result.innerHTML = `

                    <div class="profile">

                        <img
                            src="${data.avatar_url}"
                            alt="${data.login}"
                        >


                        <div>

                            <h2>
                                ${data.name || data.login}
                            </h2>


                            <p>
                                ${data.bio || "No bio available."}
                            </p>


                            <div class="stats">

                                <div class="stat">
                                    📦 Repos:
                                    ${data.public_repos}
                                </div>

                                <div class="stat">
                                    👥 Followers:
                                    ${data.followers}
                                </div>

                                <div class="stat">
                                    👤 Following:
                                    ${data.following}
                                </div>

                            </div>


                            <p class="links">

                                <a
                                    href="${data.html_url}"
                                    target="_blank">
                                    GitHub Profile →
                                </a>


                                ${
                                    data.blog
                                    ?
                                    `<a
                                        href="${
                                            data.blog.startsWith("http")
                                            ? data.blog
                                            : "https://" + data.blog
                                        }"
                                        target="_blank">
                                        Website →
                                    </a>`
                                    :
                                    ""
                                }

                            </p>

                        </div>

                    </div>

                `;

            }


            catch (err) {

                status.innerHTML =
                    `<div class="error">
                        ❌ ${err.message}
                    </div>`;

            }

        }


        document
            .getElementById("searchBtn")
            .addEventListener(
                "click",
                searchUser
            );


        username.addEventListener(
            "keydown",
            function (e) {

                if (e.key === "Enter") {

                    searchUser();

                }

            }
        );


        searchUser();

    </script>

</body>

</html>
